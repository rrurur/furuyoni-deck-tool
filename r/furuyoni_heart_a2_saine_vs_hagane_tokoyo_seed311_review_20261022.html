    '<div class="charText">'+escapeHtml(info.characterNames.join(" ＋ "))+'</div>'+
    '<div class="focusText">集中力 '+Number(st['p'+p+'_focus']||0)+(Number(st['p'+p+'_freeze']||0)?' / 凍結 '+Number(st['p'+p+'_freeze']||0):'')+'</div>'+thallya+
    '<div class="resGrid">'+
      '<div class="res life"><b>'+Number(st['p'+p+'_life']||0)+'</b><span>ライフ</span></div>'+
      '<div class="res aura"><b>'+Number(st['p'+p+'_aura']||0)+'</b><span>オーラ</span></div>'+
      '<div class="res flare"><b>'+Number(st['p'+p+'_flare']||0)+'</b><span>フレア</span></div>'+
    '</div></div>'+
    '<div class="playerPlay"><div class="mainZones">'+
      '<div class="zone handZone"><div class="zoneTitle">手札 '+(st['p'+p+'_hand']||[]).length+'</div><div class="cards">'+cards(st['p'+p+'_hand'])+'</div></div>'+
      '<div class="rightZones">'+
        '<div class="zone enhancementZone"><div class="zoneTitle">展開中 '+(st['p'+p+'_enhancement']||[]).length+'</div><div class="cards">'+enh+'</div></div>'+
        '<div class="zone specialZone"><div class="zoneTitle">切札 '+(st['p'+p+'_special']||[]).length+'</div><div class="cards">'+special+'</div></div>'+
      '</div>'+
    '</div><div class="sideStacks">'+
      '<div class="deckStack">'+deckImages+'<span class="deckCount">'+deckCount+'</span></div>'+
      '<div class="pileCluster"><div class="discardStack">'+discard+'</div><div class="facedownStack">'+facedown+'</div></div>'+
    '</div></div>';
}
function eventText(e){
  if(!e||typeof e!=="object")return String(e);
  const bits=[e.kind,e.effect];
  if(e.cardId)bits.push(cardName(e.cardId));
  if(e.targetCardId)bits.push("→ "+cardName(e.targetCardId));
  if(e.amount!==undefined)bits.push("量:"+e.amount);
  if(e.count!==undefined)bits.push("数:"+e.count);
  if(e.moved!==undefined)bits.push("移動:"+e.moved);
  if(e.form)bits.push("Form:"+e.form);
  if(e.returnedForm)bits.push("戻す:"+e.returnedForm);
  if(e.choice)bits.push("選択:"+e.choice);
  if(Array.isArray(e.cards)&&e.cards.length)bits.push(e.cards.map(cardName).join("、"));
  if(e.auraDamage!==undefined||e.lifeDamage!==undefined)bits.push((e.auraDamage??"-")+"/"+(e.lifeDamage??"-"));
  return bits.filter(Boolean).join(" / ");
}
function render(i){
  index=Math.max(0,Math.min(visibleSteps.length-1,i));
  const step=visibleSteps[index],st=step.state;
  el("p1").innerHTML=playerHtml(1,replay.p1,st);
  el("p2").innerHTML=playerHtml(2,replay.p2,st);
  el("p1").classList.toggle("active",step.actor===1);el("p2").classList.toggle("active",step.actor===2);
  el("centerResources").innerHTML='<div>ダスト '+st.dust+'</div><div>間合 '+st.distance+'</div><div class="meta">'+(step.turn?'T'+Math.ceil(Number(step.turn)/2):'初期局面')+'</div>';
  const usedCard=step.action?.cardId ? cardHtml(step.action.cardId,"") : "";
  el("centerReplay").innerHTML='<div class="usingCurrent">'+usedCard+'</div>';
  el("actionLog").textContent=step.label||"";
  el("events").innerHTML=(step.events||[]).map(e=>'<div class="event">'+escapeHtml(eventText(e))+'</div>').join("")||'<span class="muted">なし</span>';
  el("slider").value=String(index);el("counter").textContent=index+" / "+(visibleSteps.length-1);
  renderReview();
}

function currentReviewItem(){
  const step=visibleSteps[index];
  return step && step.decisionId ? reviewLookup.get(step.decisionId)||null : null;
}
function reviewedCount(){
  return reviewPack.items.filter(item=>item.review?.status==="reviewed").length;
}
function renderReview(){
  const item=currentReviewItem();
  el("reviewTarget").textContent=item ? "局面 "+item.step+" / "+item.decisionId : "初期局面は評価対象外です。";
  el("reviewCount").textContent="評価済み "+reviewedCount()+" / "+reviewPack.items.length;
  for(const verdict of ["ok","bad","uncertain"]){
    const id=verdict==="ok"?"reviewOk":verdict==="bad"?"reviewBad":"reviewUncertain";
    el(id).disabled=!item;
    el(id).setAttribute("aria-pressed",String(!!item && item.review?.status==="reviewed" && item.review?.verdict===verdict));
  }
  el("reviewClear").disabled=!item;
  el("reviewNote").disabled=!item;
  el("reviewNote").value=item?.review?.note||"";
}
function reviewStatus(message,isError=false){
  el("reviewStatus").textContent=message;
  el("reviewStatus").style.color=isError?"#a11724":"#4d5968";
}
function saveReviews(){
  try {
    localStorage.setItem(reviewStorageKey,JSON.stringify(reviewPack));
    reviewStatus("評価をブラウザに保存しました。");
  }catch(error){
    reviewStatus("ブラウザ内に保存できません。評価JSONを書き出してください。",true);
  }
}
function setVerdict(verdict){
  const item=currentReviewItem();
  if(!item)return;
  item.review.status="reviewed";
  item.review.verdict=verdict;
  item.review.preferredAction=null;
  saveReviews();
  renderReview();
}
function clearVerdict(){
  const item=currentReviewItem();
  if(!item)return;
  item.review.status="unreviewed";
  item.review.verdict=null;
  item.review.preferredAction=null;
  saveReviews();
  renderReview();
}
function applyImportedReviews(incoming){
  if(incoming?.kind!==reviewPack.kind || !Array.isArray(incoming.items)){
    throw new Error("このリプレイの評価JSONではありません。");
  }
  if(JSON.stringify(incoming.source)!==JSON.stringify(reviewPack.source)){
    throw new Error("別の試合の評価JSONです。");
  }
  if(incoming.items.length!==reviewPack.items.length){
    throw new Error("局面数が一致しません。");
  }
  const seen=new Set(),updates=[];
  for(const imported of incoming.items){
    const id=String(imported?.decisionId||"");
    const reference=reviewLookup.get(id);
    if(!reference||seen.has(id)||Number(imported.step)!==reference.step||
       JSON.stringify(imported.action)!==JSON.stringify(reference.action)){
      throw new Error("不明な局面ID・行動データが含まれています。");
    }
    seen.add(id);
    const review=imported.review||{};
    const status=String(review.status||"unreviewed");
    const verdict=review.verdict==null?null:String(review.verdict);
    if(!["reviewed","unreviewed"].includes(status)||
       (status==="reviewed"&&!["ok","bad","uncertain"].includes(verdict))){
      throw new Error("無効な評価が含まれています。");
    }
    updates.push({
      reference,
      review:{
        status,verdict:status==="reviewed"?verdict:null,
        preferredAction:null,
        note:String(review.note||"").slice(0,2000)
      }
    });
  }
  if(seen.size!==reviewPack.items.length)throw new Error("局面が不足しています。");
  for(const update of updates)update.reference.review=update.review;
  renderReview();
}
function restoreReviews(){
  try{
    const saved=localStorage.getItem(reviewStorageKey);
    if(saved)applyImportedReviews(JSON.parse(saved));
  }catch(error){
    reviewStatus("保存済み評価を復元できませんでした。JSONで再読み込みできます。",true);
  }
}
function exportReviews(){
  const blob=new Blob([JSON.stringify(reviewPack,null,2)],{type:"application/json;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="furuyoni_ai_review_"+replay.p1.characters.join("-")+"_vs_"+replay.p2.characters.join("-")+"_h"+replay.replayFingerprint.slice(0,12)+".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
  reviewStatus("評価JSONを書き出しました。");
}
el("reviewOk").onclick=()=>setVerdict("ok");
el("reviewBad").onclick=()=>setVerdict("bad");
el("reviewUncertain").onclick=()=>setVerdict("uncertain");
el("reviewClear").onclick=clearVerdict;
el("reviewNote").oninput=e=>{
  const item=currentReviewItem();
  if(!item)return;
  item.review.note=String(e.target.value||"").slice(0,2000);
  saveReviews();
};
el("reviewExport").onclick=exportReviews;
el("reviewImport").onclick=()=>el("reviewImportFile").click();
el("reviewImportFile").onchange=async e=>{
  const file=e.target.files?.[0];
  if(!file)return;
  try{
    applyImportedReviews(JSON.parse(await file.text()));
    saveReviews();
    reviewStatus("評価JSONを読み込みました。");
  }catch(error){
    reviewStatus("読み込み失敗: "+error.message,true);
  }finally{
    e.target.value="";
  }
};
function stop(){if(timer){clearInterval(timer);timer=null;el("play").textContent="再生"}}
el("first").onclick=()=>{stop();render(0)};el("prev").onclick=()=>{stop();render(index-1)};el("next").onclick=()=>{stop();render(index+1)};el("last").onclick=()=>{stop();render(visibleSteps.length-1)};
el("slider").oninput=e=>{stop();render(Number(e.target.value))};
el("play").onclick=()=>{if(timer){stop();return}el("play").textContent="停止";timer=setInterval(()=>{if(index>=visibleSteps.length-1){stop();return}render(index+1)},700)};
document.addEventListener("keydown",e=>{
  const target=e.target;
  if(target && ["INPUT","TEXTAREA"].includes(target.tagName))return;
  if(e.key==="ArrowLeft"){stop();render(index-1)}
  else if(e.key==="ArrowRight"){stop();render(index+1)}
  else if(e.key==="Home"){stop();render(0)}
  else if(e.key==="End"){stop();render(visibleSteps.length-1)}
});
el("slider").max=String(visibleSteps.length-1);
el("notice").textContent=replay.note;
el("summary").innerHTML='<span><b>'+escapeHtml(replay.p1.name)+'</b> '+escapeHtml(replay.p1.characterNames.join("＋"))+'</span><span><b>'+escapeHtml(replay.p2.name)+'</b> '+escapeHtml(replay.p2.characterNames.join("＋"))+'</span><span>勝者: <b>AI '+replay.winner+'</b></span><span>決着: <b>'+escapeHtml(replay.doneReason)+'</b></span><span>'+Math.ceil(Number(replay.steps[replay.steps.length-1]?.turn||replay.completedTurns)/2)+'ターン / '+replay.actions+'行動</span>';
restoreReviews();
render(0);
</script>
</body>
</html>
